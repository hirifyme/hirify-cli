name: CLI artifact acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-candidate
          path: .artifacts/
          include-hidden-files: true
  platform:
    needs: artifact
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-candidate
          path: .artifacts
      - run: npm run test:package
      - run: npm run test:install
      - run: npm test
        if: ${{ !cancelled() && env.HIRIFY_TEST_CLI != '' }}

  codex-sandbox:
    # Ubuntu 24 restricts unprivileged user namespaces for downloaded executables.
    # Use a runner that supports Codex bubblewrap without changing host security policy.
    runs-on: ubuntu-22.04
    needs: artifact
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-candidate
          path: .artifacts
      - run: npm run test:package
      - run: npm exec --yes --package=@openai/codex@0.155.0 -- node scripts/codex-sandbox-smoke.mjs
